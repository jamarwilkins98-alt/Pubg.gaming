<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PUBG Tournament Registration</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><header><p class="eyebrow">PUBG TOURNAMENTS</p><h1>Player Registration</h1><p class="sub">Register for 1v1, 2v2, 3v3 or 4v4 competition.</p></header><section class="card"><form id="registrationForm"><label>Player / Team Tag<input name="playerTag" maxlength="30" required placeholder="e.g. JamarGaming"></label><label>PUBG ID Number<input name="pubgId" inputmode="numeric" maxlength="30" required placeholder="Your PUBG ID"></label><label>Email / Contact<input name="contact" type="email" maxlength="120" required placeholder="you@example.com"></label><label>Tournament Type<select name="tournamentType" required><option value="">Select format</option><option>1v1</option><option>2v2</option><option>3v3</option><option>4v4</option></select></label><label>Team Name (optional)<input name="teamName" maxlength="50" placeholder="Required for team formats"></label><button type="submit">Submit Registration</button><p id="message" role="status"></p></form></section></main><script type="module" src="app.js"></script></body></html>
